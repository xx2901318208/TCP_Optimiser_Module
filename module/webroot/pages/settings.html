<div class="card settings">
  <div class="card-header">
	<h3>设置</h3>
  </div>
  
  <div class="collapsible-group">
    <div class="collapsible-header">
      <h4>TCP 设置</h4>
      <span class="arrow">▼</span>
    </div>
    <div class="collapsible-content">
	  <div class="setting-group">
		<div class="setting-row">
		  <label for="wifi-algo">TCP 拥塞算法 (Wi-Fi)</label>
		  <select id="wifi-algo" class="dropdown">
			<option value="none">正在加载选项</option>
		  </select>
		</div>
	  </div>

	  <div class="setting-group">
		<div class="setting-row">
		  <label for="wifi-qdisc">队列调度规则 (Wi-Fi)</label>
		  <select id="wifi-qdisc" class="dropdown">
			<option value="none">正在加载选项</option>
		  </select>
		</div>
	  </div>

	  <div class="setting-group">
		<div class="setting-row">
		  <label for="cellular-algo">TCP 拥塞算法 (蜂窝数据)</label>
		  <select id="cellular-algo" class="dropdown">
			<option value="none">正在加载选项</option>
		  </select>
		</div>
	  </div>

	  <div class="setting-group">
		<div class="setting-row">
		  <label for="cellular-qdisc">队列调度规则 (蜂窝数据)</label>
		  <select id="cellular-qdisc" class="dropdown">
			<option value="none">正在加载选项</option>
		  </select>
		</div>
	  </div>

	  <div class="setting-group toggle-container">
		<label id="kill-connections-label" for="kill-connections">切换时断开连接</label>
		<label class="toggle">
		  <input type="checkbox" id="kill-connections">
		  <span class="slider"></span>
		</label>
	  </div>

	  <div class="setting-group toggle-container">
		<label id="initcwnd-initrwnd-label" for="initcwnd-initrwnd">设置最大 initcwnd 和 initrwnd</label>
		<label class="toggle">
		  <input type="checkbox" id="initcwnd-initrwnd">
		  <span class="slider"></span>
		</label>
	  </div>
	</div>
  </div>
  
	<div class="setting-group toggle-container">
		<button id="apply" class="apply-btn">应用</button>
	</div>

	<div class="setting-group toggle-container">
		<button id="force-apply" class="apply-btn">强制应用</button>
	</div>
</div>
